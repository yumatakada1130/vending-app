<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020617"><title>自販機スマホ入力 完成版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;padding:8px 8px 28px}.head{background:#020617;color:#fff;padding:16px;border-radius:12px;margin-bottom:8px}.sub{font-size:12px;color:#94a3b8}.title{font-size:20px;font-weight:900}.step{font-size:14px;color:#cbd5e1;margin-top:4px}.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden}.pad{padding:14px}.row{display:flex;align-items:center;gap:5px;min-height:44px;padding:4px;border-bottom:1px solid #e2e8f0}.row:last-child{border-bottom:0}.col{width:30px;flex:none;font-size:12px;font-weight:900}.temp{width:25px;height:25px;flex:none;border-radius:5px;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}.hot{background:#f97316}.cold{background:#0ea5e9}.item{flex:1;min-width:0;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yen{width:46px;flex:none;text-align:right;font-size:12px;font-weight:900}.sold{width:46px;height:32px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-weight:900}.sold.on{background:#e11d48;color:#fff}.soldrow{background:#fff1f2}.qty{width:58px;height:36px;border:1px solid #94a3b8;border-radius:6px;text-align:right;font-size:18px;font-weight:900}.qty:focus,.pricein:focus{outline:3px solid #38bdf8}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:900;font-size:14px;margin-top:8px}.green{background:#059669;color:#fff}.blue{background:#0369a1;color:#fff}.orange{background:#ea580c;color:#fff}.dark{background:#020617;color:#fff}.back{background:#fff;border:1px solid #cbd5e1;color:#334155}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary{margin-top:8px;background:#020617;color:#fff;border-radius:12px;padding:14px}.sumrow{display:flex;justify-content:space-between;margin:5px 0}.price-row{display:grid;grid-template-columns:50px minmax(0,1fr) 74px;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #e2e8f0}.meta{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:#64748b}.salesnum{color:#0369a1;font-weight:900}.pricein{width:100%;margin-top:5px;padding:8px;border:1px solid #94a3b8;border-radius:6px;text-align:right;font-size:20px;font-weight:900}.check{font-size:12px;text-align:right}.ok{color:#047857;font-weight:900}.bad{color:#e11d48;font-weight:900}.match{margin-top:10px;border-radius:8px;padding:9px;text-align:center;font-weight:900;background:#f59e0b}.match.good{background:#10b981}.done{text-align:center;background:#fff;border-radius:16px;padding:28px}.tick{font-size:50px;color:#059669}.hist{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px}.status{float:right;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:900;background:#fef3c7;color:#92400e}.status.good{background:#d1fae5;color:#047857}.histacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.mini{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:9px;font-weight:800}.mini.danger{color:#be123c;border-color:#fda4af}.cancelled{opacity:.55;text-decoration:line-through}.replace{background:#fff7ed;border-left:5px solid #ea580c}.replace-name{font-size:11px;color:#9a3412;font-weight:900;white-space:normal}.load{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:8px}.load.donepick{opacity:.5;background:#e2e8f0}.loadname{font-size:17px;font-weight:900}.loadqty{font-size:32px;font-weight:950;color:#0369a1}.detail{font-size:12px;color:#64748b;margin-top:5px}.pick{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:900}.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.notice{padding:10px;border-radius:10px;background:#fffbeb;color:#92400e;font-weight:750;font-size:13px;margin-bottom:8px}.replace-done{background:#d1fae5!important}.choice small{display:block;margin-top:3px;font-weight:500}.mode-note{font-size:12px;color:#64748b;margin-bottom:8px}
</style></head><body><div id="app"></div><script>
const machineName='盛岡中央ビル 1号機';
const names=['ワンダ モーニングショット ブラック','三ツ矢 特濃オレンジスカッシュ 500ml','十六茶 ラベルレスボトル 500ml','カルピスウォーター 500mlペットボトル','ウィルキンソン タンサン レモン 500ml'];
const productPrices=[130,150,160,140,180];
let cols=Array.from({length:30},(_,i)=>({no:i+1,item:names[i%5],temp:i<12?'温':'冷',price:productPrices[i%5],nextItem:null,nextPrice:null,replaced:false}));
cols[4].nextItem='カルピスウォーター 500mlペットボトル';cols[4].nextPrice=140;cols[12].nextItem='ワンダ モーニングショット ブラック';cols[12].nextPrice=130;
const prices=[130,140,150,160,180,200],prev={130:1250,140:520,150:840,160:410,180:225,200:96};
let step='mode',mode='',sold={},counts={},pt={},order='asc',lastId=null,currentId=null,onlyPending=false,showCancelled=false;
let history=loadHistory();
function samples(){return[{id:'s1',date:'10/21 15:05',type:'月末締め',monthClose:true,sales:12,price:10,diff:2,status:'要確認',counts:{1:'5',2:'4',3:'3'},cancelled:false,loadDone:{}},{id:'s2',date:'10/14 13:48',type:'通常補充',monthClose:false,sales:12,price:'-',diff:'-',status:'保存済',counts:{1:'5',6:'3',11:'4'},cancelled:false,loadDone:{}}]}
function loadHistory(){try{return JSON.parse(localStorage.getItem('vendingHistoryV3'))||samples()}catch(e){return samples()}}
function persist(){localStorage.setItem('vendingHistoryV3',JSON.stringify(history));localStorage.setItem('vendingColumnsV3',JSON.stringify(cols))}
try{const saved=JSON.parse(localStorage.getItem('vendingColumnsV3'));if(saved&&saved.length===30)cols=saved}catch(e){}
const N=v=>Number(v)||0,total=()=>Object.values(counts).reduce((a,v)=>a+N(v),0),amount=()=>cols.reduce((s,c)=>s+N(counts[c.no])*c.price,0),colPrice=p=>cols.reduce((s,c)=>s+(c.price===p?N(counts[c.no]):0),0),priceSale=p=>pt[p]===undefined||pt[p]===''?0:Math.max(0,N(pt[p])-N(prev[p])),priceTotal=()=>prices.reduce((s,p)=>s+priceSale(p),0),diff=()=>total()-priceTotal(),matched=()=>diff()===0&&total()>0;
const now=()=>new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),yearMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},head=t=>`<div class="head"><div class="sub">現場スマホ入力</div><div class="title">${machineName}</div><div class="step">${t}</div></div>`;
function go(s){step=s;draw();scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}
function start(m){mode=m;sold={};counts={};pt={};go('sold')}
function toggleSold(n){sold[n]=!sold[n];draw()}
function setCount(n,v){counts[n]=v.replace(/\D/g,'');const e=document.getElementById('liveTotal');if(e)e.textContent=total()+'本'}
function advance(i){const a=[...document.querySelectorAll('.qty')];if(a[i+1]){a[i+1].focus();a[i+1].select();a[i+1].scrollIntoView({block:'center',behavior:'smooth'})}}
function setPrice(p,v){pt[p]=v.replace(/\D/g,'')}
function makeRecord(type){return{id:String(Date.now()),date:now(),yearMonth:yearMonth(),type,monthClose:type==='月末締め',sales:total(),price:type==='通常補充'?'-':priceTotal(),diff:type==='通常補充'?'-':diff(),status:type==='通常補充'?'保存済':matched()?'一致':'要確認',counts:{...counts},sold:{...sold},amount:amount(),cancelled:false,loadDone:{},replacements:type==='商品入れ替え'?cols.filter(c=>c.nextItem&&!c.replaced).map(c=>({no:c.no,oldItem:c.item,newItem:c.nextItem,newPrice:c.nextPrice})):[]}}
function save(){const type=mode==='mid'?'通常補充':mode==='replace'?'商品入れ替え':'月末締め',r=makeRecord(type);history.unshift(r);persist();lastId=r.id;go('done')}
function cancelRecord(id){const r=history.find(x=>x.id===id);if(!r)return;if(!confirm('この履歴を取消にしますか？データは削除せず取消履歴として残します。'))return;r.cancelled=true;r.status='取消済';persist();draw()}
function confirmReplace(){if(!confirm('入替予定の商品を現在商品へ切り替えますか？'))return;cols.forEach(c=>{if(c.nextItem&&!c.replaced){c.item=c.nextItem;c.price=c.nextPrice||c.price;c.replaced=true}});persist();draw()}
function openLoad(id){currentId=id;onlyPending=false;go('load')}
function toggleLoaded(name){const r=history.find(x=>x.id===currentId);if(!r)return;r.loadDone=r.loadDone||{};r.loadDone[name]=!r.loadDone[name];persist();draw()}
function activeMonthRecords(){const nowd=new Date(),ym=nowd.getFullYear()+'-'+String(nowd.getMonth()+1).padStart(2,'0');return history.filter(r=>!r.cancelled&&r.yearMonth===ym&&['通常補充','商品入れ替え','月末締め'].includes(r.type))}
function monthColPrice(p){return activeMonthRecords().reduce((sum,r)=>sum+cols.reduce((s,c)=>s+(c.price===p?N((r.counts||{})[c.no]):0),0),0)}
function monthTotal(){return activeMonthRecords().reduce((sum,r)=>sum+N(r.sales),0)}
function groups(r){const map={};cols.forEach(c=>{const q=N((r.counts||{})[c.no]);if(!q)return;if(!map[c.item])map[c.item]={name:c.item,total:0,hot:0,cold:0,cols:[]};const g=map[c.item];g.total+=q;c.temp==='温'?g.hot+=q:g.cold+=q;g.cols.push(`C${c.no}:${q}本`)});return Object.values(map).sort((a,b)=>b.total-a.total)}
function soldRows(){return cols.map(c=>`<div class="row ${sold[c.no]?'soldrow':''} ${mode==='replace'&&c.nextItem&&!c.replaced?'replace':''}"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}${mode==='replace'&&c.nextItem&&!c.replaced?`<div class="replace-name">入替予定 → ${c.nextItem}（${c.nextPrice||c.price}円）</div>`:''}</div><span class="yen">${c.price}円</span><button class="sold ${sold[c.no]?'on':''}" onclick="toggleSold(${c.no})">売切</button></div>`).join('')}
function salesRows(){return cols.map((c,i)=>`<div class="row ${mode==='replace'&&c.nextItem&&!c.replaced?'replace':''}"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}${mode==='replace'&&c.nextItem&&!c.replaced?`<div class="replace-name">入替予定 → ${c.nextItem}</div>`:''}</div><span class="yen">${c.price}円</span><input class="qty" inputmode="numeric" enterkeyhint="next" value="${counts[c.no]||''}" oninput="setCount(${c.no},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();advance(${i})}"></div>`).join('')}
function priceScreen(){const ps=order==='asc'?[...prices]:[...prices].reverse(),rows=ps.map(p=>{const entered=pt[p]!==undefined&&pt[p]!=='',baseCount=mode==='month'?monthColPrice(p)+colPrice(p):colPrice(p),d=baseCount-priceSale(p);return`<div class="price-row"><b>${p}円</b><div><div class="meta"><span>前回 ${prev[p]}本</span><span class="salesnum">売上本数 ${baseCount}本</span></div><input class="pricein" inputmode="numeric" placeholder="累計" value="${pt[p]||''}" onchange="setPrice(${p},this.value);draw()"></div><div class="check">${entered?`今回 <b class="ok">${priceSale(p)}本</b><br><span class="${d===0?'ok':'bad'}">差異 ${d>0?'+':''}${d}本</span>`:''}</div></div>`}).join('');return head(`${mode==='replace'?'商品入れ替え':'月末締め'} / ③ 価格別累計本数`)+`<div class="tools"><div></div><div><button onclick="order='asc';draw()">安い順</button><button onclick="order='desc';draw()">高い順</button></div></div><div class="card">${rows}</div><div class="summary"><div class="sumrow"><span>${mode==='month'?'当月コラム累計':'コラム別'}</span><b>${mode==='month'?monthTotal()+total():total()}本</b></div><div class="sumrow"><span>価格別</span><b>${priceTotal()}本</b></div><div class="sumrow"><span>差異</span><b>${diff()}本</b></div><div class="sumrow"><span>売上金額</span><b>${amount().toLocaleString()}円</b></div><div class="match ${matched()?'good':''}">${matched()?'本数一致 ✓':'差異あり・要確認'}</div></div><div class="actions"><button class="btn back" onclick="go('sales')">← 販売本数へ</button><button class="btn green" onclick="save()">${matched()?'確認して保存':'差異ありで保存'}</button></div>`}
function draw(){let h='';if(step==='mode'){h=head('入力種類を選択')+`<div class="card pad"><div class="mode-note">作業内容を選択してください。履歴には作業種別を保存します。</div><button class="btn green choice" onclick="start('mid')">通常補充<small>コラム別だけ入力</small></button><button class="btn orange choice" onclick="start('replace')">商品入れ替え<small>旧商品のコラム別＋価格別を入力し、入替予定を確認</small></button><button class="btn blue choice" onclick="start('month')">月末締め<small>コラム別＋価格別。月末締めフラグ付きで保存</small></button><button class="btn dark" onclick="go('history')">入力履歴を見る</button></div>`}
else if(step==='sold'){h=head(`${mode==='mid'?'通常補充':mode==='replace'?'商品入れ替え':'月末締め'} / ① 売切確認`)+(mode==='replace'?`<div class="notice">現在商品を表示しています。入替予定はオレンジ色の行で確認できます。</div>`:'')+`<div class="card">${soldRows()}</div><button class="btn green" onclick="go('sales')">販売本数入力へ</button><button class="btn back" onclick="go('mode')">入力種類へ戻る</button>`}
else if(step==='sales'){const forward=mode==='mid'?`<button class="btn green" onclick="save()">通常補充を保存</button>`:`<button class="btn green" onclick="go('price')">価格別累計へ</button>`;h=head(`${mode==='mid'?'通常補充':mode==='replace'?'商品入れ替え':'月末締め'} / ② コラム別販売本数`)+`<div class="card">${salesRows()}</div><div class="summary"><div class="sumrow"><span>合計</span><b id="liveTotal">${total()}本</b></div></div><div class="actions"><button class="btn back" onclick="go('sold')">← 売切確認へ</button>${forward}</div>`}
else if(step==='price'){h=priceScreen()}
else if(step==='done'){h=head('保存完了')+`<div class="done"><div class="tick">✓</div><h2>入力完了</h2><p>${mode==='mid'?'通常補充':mode==='replace'?'商品入れ替え':'月末締め'}として保存しました。</p></div>${mode==='replace'?`<button class="btn orange" onclick="confirmReplace()">入替完了：新商品へ切替</button>`:''}<button class="btn blue" onclick="openLoad('${lastId}')">🚚 積み込みリストを見る</button><button class="btn dark" onclick="go('history')">入力履歴を見る</button><button class="btn back" onclick="go('mode')">入力種類へ戻る</button>`}
else if(step==='history'){const list=history.filter(x=>showCancelled||!x.cancelled);h=head('入力履歴')+`<label style="display:block;margin:8px"><input type="checkbox" ${showCancelled?'checked':''} onchange="showCancelled=this.checked;draw()"> 取消済も表示</label>`+list.map(x=>`<div class="hist ${x.cancelled?'cancelled':''}"><span class="status ${x.status==='一致'?'good':''}">${x.status}</span><b>${x.date} / ${x.type}${x.monthClose?'【月末締め】':''}</b><div style="clear:both;margin-top:8px;font-size:13px">コラム ${x.sales}本　価格別 ${x.price}${x.price==='-'?'':'本'}　差異 ${x.diff}${x.diff==='-'?'':'本'}</div><div class="histacts"><button class="mini" onclick="openLoad('${x.id}')">積み込み</button><button class="mini" onclick="currentId='${x.id}';go('detail')">詳細</button><button class="mini danger" ${x.cancelled?'disabled':''} onclick="cancelRecord('${x.id}')">取消</button></div></div>`).join('')+`<button class="btn green" onclick="go('mode')">入力種類へ戻る</button>`}
else if(step==='detail'){const r=history.find(x=>x.id===currentId);h=head('入力履歴 詳細')+(r?`<div class="hist"><b>${r.date} / ${r.type}</b><p>コラム合計 ${r.sales}本</p>${cols.filter(c=>N((r.counts||{})[c.no])>0).map(c=>`<div class="row"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}</div><b>${N(r.counts[c.no])}本</b></div>`).join('')}</div>`:'')+`<button class="btn back" onclick="go('history')">履歴へ戻る</button>`}
else if(step==='load'){const r=history.find(x=>x.id===currentId),gs=r?groups(r):[],visible=gs.filter(g=>!onlyPending||!(r.loadDone||{})[g.name]),remaining=gs.filter(g=>!(r.loadDone||{})[g.name]).length;h=head('🚚 積み込みリスト')+`<div class="tools"><b>未積込 ${remaining}商品</b><label><input type="checkbox" ${onlyPending?'checked':''} onchange="onlyPending=this.checked;draw()"> 未積込のみ</label></div>`+(visible.length?visible.map(g=>`<div class="load ${(r.loadDone||{})[g.name]?'donepick':''}"><div class="loadname">${g.name}</div><div class="loadqty">${g.total}本</div><div class="detail">温 ${g.hot}本 / 冷 ${g.cold}本</div><div class="detail">${g.cols.join('　')}</div><button class="pick" onclick="toggleLoaded('${g.name.replace(/'/g,"\\'")}')">${(r.loadDone||{})[g.name]?'積込済を戻す':'積込済にする'}</button></div>`).join(''):`<div class="done"><div class="tick">✓</div><h2>積み込み完了</h2></div>`)+`<button class="btn back" onclick="go('history')">履歴へ戻る</button>`}
document.getElementById('app').innerHTML=`<div class="app">${h}</div>`}draw();
</script></body></html>
