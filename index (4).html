<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>自販機スマホ入力 完成版</title>
<style>
:root{--navy:#020617;--green:#059669;--blue:#0369a1;--line:#cbd5e1;--bg:#f1f5f9;--text:#0f172a}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;padding:8px 8px 24px}.head{background:var(--navy);color:#fff;padding:16px;border-radius:12px;margin-bottom:8px}.small{font-size:12px;color:#94a3b8}.title{font-size:20px;font-weight:800}.step{font-size:14px;color:#cbd5e1;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.mode{padding:16px}.mode-note{font-size:12px;color:#64748b;margin:4px 0 12px}.row{display:flex;align-items:center;gap:5px;min-height:44px;padding:4px;border-bottom:1px solid #e2e8f0}.row:last-child{border-bottom:0}.soldrow{background:#fff1f2}.col{width:30px;flex:none;font-size:12px;font-weight:800}.temp{width:25px;height:25px;flex:none;border-radius:5px;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}.hot{background:#f97316}.cold{background:#0ea5e9}.item{min-width:0;flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yen{width:48px;flex:none;text-align:right;font-size:12px;font-weight:800}.sold{width:46px;height:32px;flex:none;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:800}.sold.on{background:#e11d48;color:#fff}.input{width:58px;height:36px;flex:none;border:1px solid #94a3b8;border-radius:6px;text-align:right;font-size:18px;font-weight:800}.input:focus{outline:3px solid #38bdf8;border-color:#0284c7}.btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:14px;margin-top:8px}.next{background:var(--green);color:#fff}.month{background:var(--blue);color:#fff}.back{background:#fff;border:1px solid var(--line);color:#334155}.dark{background:var(--navy);color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary{margin-top:8px;background:var(--navy);color:#fff;border-radius:12px;padding:14px}.sumrow{display:flex;justify-content:space-between;margin:5px 0}.price-row{display:grid;grid-template-columns:55px minmax(0,1fr) 75px;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #e2e8f0}.price-row:last-child{border-bottom:0}.price-meta{display:flex;justify-content:space-between;gap:5px;font-size:11px;color:#64748b}.salesnum{color:#0369a1;font-weight:800}.price-input{width:100%;margin-top:5px;padding:8px;border:1px solid #94a3b8;border-radius:6px;text-align:right;font-size:20px;font-weight:800}.check{font-size:12px;text-align:right}.ok{color:#047857;font-weight:800}.bad{color:#e11d48;font-weight:800}.match{margin-top:10px;border-radius:8px;padding:9px;text-align:center;font-weight:800;background:#f59e0b}.match.good{background:#10b981}.order{text-align:right;margin-bottom:8px}.order button{padding:7px 10px;border:0;background:#334155;color:#fff}.order button.on{background:#fff;color:#0f172a;border:1px solid #334155}.done{text-align:center;background:#fff;border-radius:16px;padding:28px}.tick{font-size:50px;color:var(--green)}.history{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #e2e8f0}.status{float:right;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800}.status.ok{background:#d1fae5;color:#047857}.status.warn{background:#fef3c7;color:#92400e}.history-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;font-weight:700}.loader-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.load-card{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:8px}.load-card.donepick{opacity:.5;background:#e2e8f0}.load-name{font-size:17px;font-weight:800}.load-qty{font-size:32px;font-weight:900;color:#0369a1}.load-detail{font-size:12px;color:#64748b;margin-top:5px}.pick-btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:800}.sticky-next{position:sticky;bottom:8px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 18px #0002}.inline-note{font-size:12px;color:#64748b;text-align:center;margin-top:5px}
</style>
</head>
<body><div id="app"></div>
<script>
const machineName='盛岡中央ビル 1号機';
const names=['ワンダ モーニングショット ブラック','三ツ矢 特濃オレンジスカッシュ 500ml','十六茶 ラベルレスボトル 500ml','カルピスウォーター 500mlペットボトル','ウィルキンソン タンサン レモン 500ml'];
const productPrices=[130,150,160,140,180];
const columns=Array.from({length:30},(_,i)=>({no:i+1,item:names[i%5],temp:i<12?'温':'冷',price:productPrices[i%5]}));
const prices=[130,140,150,160,180,200];
const previous={130:1250,140:520,150:840,160:410,180:225,200:96};
let step='mode',mode='',sold={},counts={},priceTotals={},order='asc',lastSavedId=null,currentLoadId=null,hideLoaded=false;
let history=loadHistory();
function loadHistory(){try{return JSON.parse(localStorage.getItem('vendingHistoryV2'))||sampleHistory()}catch(e){return sampleHistory()}}
function sampleHistory(){return [{id:'sample1',date:'10/21 15:05',type:'月末締め',sales:72,price:70,diff:2,status:'要確認',counts:{1:'5',2:'4',3:'3'},loadDone:{}},{id:'sample2',date:'10/14 13:48',type:'通常補充',sales:12,price:'-',diff:'-',status:'保存済',counts:{1:'5',6:'3',11:'4'},loadDone:{}}]}
function persist(){localStorage.setItem('vendingHistoryV2',JSON.stringify(history))}
const N=v=>Number(v)||0;
const total=()=>Object.values(counts).reduce((a,v)=>a+N(v),0);
const salesAmount=()=>columns.reduce((s,c)=>s+N(counts[c.no])*c.price,0);
const columnPriceCount=p=>columns.reduce((s,c)=>s+(c.price===p?N(counts[c.no]):0),0);
const priceSale=p=>priceTotals[p]===undefined||priceTotals[p]===''?0:Math.max(0,N(priceTotals[p])-N(previous[p]));
const priceTotal=()=>prices.reduce((s,p)=>s+priceSale(p),0);
const diff=()=>total()-priceTotal();
const matched=()=>diff()===0&&total()>0;
const nowText=()=>new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const head=t=>`<div class="head"><div class="small">現場スマホ入力</div><div class="title">${machineName}</div><div class="step">${t}</div></div>`;
function go(s){step=s;draw();window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0}
function start(m){mode=m;sold={};counts={};priceTotals={};go('soldout')}
function toggleSold(n){sold[n]=!sold[n];draw()}
function setCount(n,v){counts[n]=v.replace(/\D/g,'');updateTotal()}
function updateTotal(){const el=document.getElementById('liveTotal');if(el)el.textContent=total()+'本'}
function advance(i){const inputs=[...document.querySelectorAll('.qty')];const next=inputs[i+1];if(next){next.focus();next.select();next.scrollIntoView({block:'center',behavior:'smooth'})}}
function focusFirst(){const first=document.querySelector('.qty');if(first){first.focus();first.select();first.scrollIntoView({block:'center',behavior:'smooth'})}}
function setPrice(p,v){priceTotals[p]=v.replace(/\D/g,'')}
function makeRecord(type,status,priceValue,diffValue){return{id:String(Date.now()),date:nowText(),type,sales:total(),price:priceValue,diff:diffValue,status,counts:{...counts},sold:{...sold},amount:salesAmount(),loadDone:{}}}
function saveMid(){const r=makeRecord('通常補充','保存済','-','-');history.unshift(r);persist();lastSavedId=r.id;go('done')}
function saveEnd(){const r=makeRecord('月末締め',matched()?'一致':'要確認',priceTotal(),diff());history.unshift(r);persist();lastSavedId=r.id;go('done')}
function openLoad(id){currentLoadId=id;hideLoaded=false;go('load')}
function toggleLoaded(name){const r=history.find(x=>x.id===currentLoadId);if(!r)return;r.loadDone=r.loadDone||{};r.loadDone[name]=!r.loadDone[name];persist();draw()}
function loadingGroups(record){const map={};columns.forEach(c=>{const q=N((record.counts||{})[c.no]);if(!q)return;if(!map[c.item])map[c.item]={name:c.item,total:0,hot:0,cold:0,cols:[]};const g=map[c.item];g.total+=q;if(c.temp==='温')g.hot+=q;else g.cold+=q;g.cols.push(`C${c.no}:${q}本`)});return Object.values(map).sort((a,b)=>b.total-a.total)}
function draw(){let h='';
if(step==='mode'){
 h=head('入力種類を選択')+`<div class="card mode"><div class="mode-note">月途中の補充と月末締めを選んでください。どちらも履歴に残ります。</div><button class="btn next" onclick="start('mid')">通常補充<br><small>コラム別だけ入力して保存</small></button><button class="btn month" onclick="start('monthend')">月末締め<br><small>コラム別＋価格別を入力</small></button><button class="btn dark" onclick="go('history')">入力履歴を見る</button></div>`;
}else if(step==='soldout'){
 h=head(`${mode==='mid'?'通常補充':'月末締め'} / ① 売切確認`)+`<div class="card">${columns.map(c=>`<div class="row ${sold[c.no]?'soldrow':''}"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}</div><span class="yen">${c.price}円</span><button class="sold ${sold[c.no]?'on':''}" onclick="toggleSold(${c.no})">売切</button></div>`).join('')}</div><button class="btn next" onclick="go('sales')">販売本数入力へ</button><button class="btn back" onclick="go('mode')">入力種類へ戻る</button>`;
}else if(step==='sales'){
 const rows=columns.map((c,i)=>`<div class="row ${sold[c.no]?'soldrow':''}"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}${sold[c.no]?'<div style="font-size:10px;color:#e11d48">売切</div>':''}</div><span class="yen">${c.price}円</span><input class="input qty" inputmode="numeric" enterkeyhint="next" value="${counts[c.no]||''}" oninput="setCount(${c.no},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();advance(${i})}"></div>`).join('');
 const forward=mode==='mid'?`<button class="btn next" onclick="saveMid()">通常補充を保存</button>`:`<button class="btn next" onclick="go('price')">価格別累計へ</button>`;
 h=head(`${mode==='mid'?'通常補充':'月末締め'} / ② コラム別販売本数`)+`<div class="card">${rows}</div><div class="summary"><div class="sumrow"><span>合計</span><b id="liveTotal">${total()}本</b></div></div><div class="sticky-next"><button class="btn month" style="margin-top:0" onclick="focusFirst()">C1から連続入力を開始</button><div class="inline-note">テンキーの「次へ」で次のコラムへ移動</div></div><div class="actions"><button class="btn back" onclick="go('soldout')">← 売切確認へ</button>${forward}</div>`;
}else if(step==='price'){
 const ps=order==='asc'?[...prices]:[...prices].reverse();
 const rows=ps.map(p=>{const entered=priceTotals[p]!==undefined&&priceTotals[p]!=='';const d=columnPriceCount(p)-priceSale(p);return `<div class="price-row"><b>${p}円</b><div><div class="price-meta"><span>前回 ${previous[p]}本</span><span class="salesnum">売上本数 ${columnPriceCount(p)}本</span></div><input class="price-input" inputmode="numeric" placeholder="累計" value="${priceTotals[p]||''}" onchange="setPrice(${p},this.value);draw()"></div><div class="check">${entered?`今回 <b class="ok">${priceSale(p)}本</b><br><span class="${d===0?'ok':'bad'}">差異 ${d>0?'+':''}${d}本</span>`:''}</div></div>`}).join('');
 h=head('月末締め / ③ 価格別累計本数')+`<div class="order"><button class="${order==='asc'?'on':''}" onclick="order='asc';draw()">安い順</button><button class="${order==='desc'?'on':''}" onclick="order='desc';draw()">高い順</button></div><div class="card">${rows}</div><div class="summary"><div class="sumrow"><span>コラム別</span><b>${total()}本</b></div><div class="sumrow"><span>価格別</span><b>${priceTotal()}本</b></div><div class="sumrow"><span>差異</span><b>${diff()}本</b></div><div class="sumrow" style="border-top:1px solid #475569;padding-top:8px;font-size:18px"><span>売上金額</span><b>${salesAmount().toLocaleString()}円</b></div><div class="match ${matched()?'good':''}">${matched()?'本数一致 ✓':'差異あり・要確認'}</div></div><div class="actions"><button class="btn back" onclick="go('sales')">← 販売本数へ</button><button class="btn next" onclick="saveEnd()">${matched()?'確認して保存':'差異ありで保存'}</button></div>`;
}else if(step==='done'){
 h=head('保存完了')+`<div class="done"><div class="tick">✓</div><h2>入力完了</h2><p>${mode==='mid'?'通常補充':'月末締め'}として履歴に保存しました。</p></div><button class="btn month" onclick="openLoad('${lastSavedId}')">🚚 積み込みリストを見る</button><button class="btn dark" onclick="go('history')">入力履歴を見る</button><button class="btn back" onclick="go('mode')">入力種類へ戻る</button>`;
}else if(step==='history'){
 h=head('入力履歴')+history.map(x=>`<div class="history"><span class="status ${x.status==='一致'?'ok':'warn'}">${x.status}</span><b>${x.date} / ${x.type}</b><div style="clear:both;margin-top:8px;font-size:13px">コラム ${x.sales}本　価格別 ${x.price}${x.price==='-'?'':'本'}　差異 ${x.diff}${x.diff==='-'?'':'本'}</div><div class="history-actions"><button class="mini" onclick="openLoad('${x.id}')">積み込み</button><button class="mini" onclick="currentLoadId='${x.id}';go('detail')">詳細</button></div></div>`).join('')+`<button class="btn next" onclick="go('mode')">入力種類へ戻る</button>`;
}else if(step==='detail'){
 const r=history.find(x=>x.id===currentLoadId);h=head('入力履歴 詳細')+(r?`<div class="history"><b>${r.date} / ${r.type}</b><p>コラム合計 ${r.sales}本</p>${columns.filter(c=>N((r.counts||{})[c.no])>0).map(c=>`<div class="row"><b class="col">C${c.no}</b><span class="temp ${c.temp==='温'?'hot':'cold'}">${c.temp}</span><div class="item">${c.item}</div><b>${N(r.counts[c.no])}本</b></div>`).join('')}</div>`:'<div class="card mode">データがありません</div>')+`<button class="btn back" onclick="go('history')">履歴へ戻る</button>`;
}else if(step==='load'){
 const r=history.find(x=>x.id===currentLoadId);const groups=r?loadingGroups(r):[];const visible=groups.filter(g=>!hideLoaded||!(r.loadDone||{})[g.name]);const remaining=groups.filter(g=>!(r.loadDone||{})[g.name]).length;
 h=head('🚚 積み込みリスト')+`<div class="loader-tools"><b>未積込 ${remaining}商品</b><label><input type="checkbox" ${hideLoaded?'checked':''} onchange="hideLoaded=this.checked;draw()"> 未積込のみ</label></div>`+(visible.length?visible.map(g=>`<div class="load-card ${(r.loadDone||{})[g.name]?'donepick':''}"><div class="load-name">${g.name}</div><div class="load-qty">${g.total}本</div><div class="load-detail">温 ${g.hot}本 / 冷 ${g.cold}本</div><div class="load-detail">${g.cols.join('　')}</div><button class="pick-btn" onclick="toggleLoaded('${g.name.replace(/'/g,"\\'")}')">${(r.loadDone||{})[g.name]?'積込済を戻す':'積込済にする'}</button></div>`).join(''):'<div class="done"><div class="tick">✓</div><h2>積み込み完了</h2></div>')+`<button class="btn back" onclick="go('history')">履歴へ戻る</button>`;
}
document.getElementById('app').innerHTML=`<div class="app">${h}</div>`;
}
draw();
</script>
</body></html>
